server:
  port: 7100
  servlet:
    context-path: /api/v1
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

spring:
  application:
    name: indian-stock-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/stock-financials-data
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc.batch_size: 50
        order_inserts: true

app:
  valuation:
    required-years: 5